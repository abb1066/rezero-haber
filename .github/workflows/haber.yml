# Re:Zero haberleri (P15): saatte bir topla (2026-11-15: 3 saatten saate). 2026-11-17: GitHub saatlik tetiklerin ancak ~1/7'sini
# başlatıyordu (turlar 5–10 saat arayla). Artık 10 dakikada bir tetiklenir; "zaman" işi o UTC saati için toplama yapıldıysa
# (önbellekte haber-saat-YYYYMMDDHH işareti) asıl işi atlar. İşaret yalnızca başarılı ve kuru olmayan turdan sonra yazılır.
# → Claude (Haiku) ile Türkçe başlık/özet (anahtar: depo gizli değişkeni ANTHROPIC_API_KEY)
# → haberler.json'u "veri" dalına commit'le. Claude hiç sonuç vermezse yalnızca İngilizce haberler OPUS-MT ile; Japonca beklemede kalır (kötü çeviri yazılmaz).
# Kod main'de (sitenin deposundan gelir), veri yalnızca "veri" dalında: kod gönderimleriyle çakışmaz.
# Google/Firebase bağlantısı yok (kullanıcı 2026-11-15, "C"): depo herkese açık, site raw.githubusercontent.com/abb1066/rezero-haber/veri/haberler.json'u okur.
# Elle çalıştırma (Actions > haber > Run workflow): "kuru" işaretliyse dosyaya yazmaz ve commit atmaz, çevirileri günlüğe döker.
name: haber
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      kuru:
        description: "Kuru çalıştırma (haberler.json'a yazma)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: haber
  cancel-in-progress: false
jobs:
  zaman:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      saat: ${{ steps.s.outputs.saat }}
      yapildi: ${{ steps.c.outputs.cache-hit }}
    steps:
      - id: s
        run: echo "saat=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - id: c
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .saat
          key: haber-saat-${{ steps.s.outputs.saat }}
          lookup-only: true
      - run: echo "saat ${{ steps.s.outputs.saat }}, bu saat yapıldı mı: ${{ steps.c.outputs.cache-hit || 'hayır' }}"
  haber:
    needs: zaman
    if: needs.zaman.outputs.yapildi != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: önceki veri (veri dalı)
        run: |
          if git fetch --depth=1 origin veri 2>/dev/null; then git show FETCH_HEAD:haberler.json > haberler.json || true; git show FETCH_HEAD:atla.json > atla.json || true; else echo "veri dalı henüz yok"; fi
      - id: topla
        run: node is.mjs topla
      - id: claude
        if: steps.topla.outputs.aday != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node is.mjs claude
      - if: steps.topla.outputs.aday != '0' && steps.claude.outputs.tamam == '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.topla.outputs.aday != '0' && steps.claude.outputs.tamam == '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-v1
      - if: steps.topla.outputs.aday != '0' && steps.claude.outputs.tamam == '0'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements.txt
      - if: steps.topla.outputs.aday != '0' && steps.claude.outputs.tamam == '0'
        run: python cevir.py is/adaylar.json is/ceviri.json
      - if: steps.topla.outputs.aday != '0'
        run: node is.mjs yaz ${{ (github.event_name == 'workflow_dispatch' && inputs.kuru) && '--kuru' || '' }}
      - if: steps.topla.outputs.aday != '0' && !(github.event_name == 'workflow_dispatch' && inputs.kuru)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/veri && cp haberler.json atla.json /tmp/veri/ && rm -f haberler.json atla.json
          if git fetch origin veri 2>/dev/null; then git checkout -q -B veri FETCH_HEAD; else git checkout -q --orphan veri && git rm -rfq . ; fi
          cp /tmp/veri/haberler.json /tmp/veri/atla.json .
          git add -f haberler.json atla.json
          if git diff --cached --quiet; then echo "değişiklik yok"; else git commit -q -m "Haberler güncellendi" && git push -q origin veri; fi
      - name: bu saat yapıldı işareti
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.kuru)
        run: mkdir -p .saat && date -u > .saat/t
      - if: success() && !(github.event_name == 'workflow_dispatch' && inputs.kuru)
        uses: actions/cache/save@v4
        with:
          path: .saat
          key: haber-saat-${{ needs.zaman.outputs.saat }}
